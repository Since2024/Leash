[package]
name = "leash-program"
version = "0.1.0"
description = "Leash: capability accounts, issue/attenuate/revoke/redeem. See docs/BUILD_PLAN.md."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "leash_program"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.0"
# anchor-spl adds Token-2022 support (mint/token-account helpers, extension access) and,
# via associated_token, the ATA-creation CPI issue/redeem need for the capability's
# wrapped-token account. Confirmed working (not just plausible) during Week 1's spike.
anchor-spl = { version = "1.0.0", features = ["token_2022", "associated_token"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
