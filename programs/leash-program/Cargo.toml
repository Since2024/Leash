[package]
name = "leash-program"
version = "0.1.0"
description = "Leash: capability accounts, issue/attenuate/revoke/redeem. See docs/BUILD_PLAN.md."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "leash_program"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.0"
# anchor-spl adds Token-2022 support (mint/token-account helpers, extension access).
# Kept minimal until Week 1's D1-D4 spike confirms which anchor-spl features we actually need.
anchor-spl = { version = "1.0.0", features = ["token_2022"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
